services:
  yandex-price-bot:
    build: .
    container_name: yandex-price-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - prices_data:/app/data
      - backups_data:/app/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    command: ["python", "main.py"]

volumes:
  prices_data:
    name: yandex_price_bot_db
  backups_data:
    name: yandex_price_bot_backups
